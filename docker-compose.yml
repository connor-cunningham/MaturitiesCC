version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: maturities_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maturities}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maturities_dev}
      POSTGRES_DB: ${POSTGRES_DB:-maturities}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maturities}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: maturities_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
